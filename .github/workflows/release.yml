name: Release

# A tag such as v1.0.0 runs the whole of CI on it, then attaches its packages
# to a draft GitHub release, which a maintainer reads and publishes by hand
# (docs/release-checklist.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    # The tag names the version CMakeLists.txt declares, which the packages carry.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the project's version
        run: |
          version="$(sed -n 's/^project(resend VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          echo "CMakeLists.txt: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  draft:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-packages'
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "resend ${GITHUB_REF_NAME#v}" --generate-notes dist/*
